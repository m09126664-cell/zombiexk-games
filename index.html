<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101126"><title>GameZone | Oyununu Seç</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#171e35;--muted:#aab4d0;--purple:#8b5cf6;--cyan:#22d3ee}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#29204f 0,#0b1020 58%);color:#f7f8ff;font:16px system-ui,Arial,sans-serif;min-height:100vh}
header{position:sticky;top:0;z-index:5;background:#101329ed;backdrop-filter:blur(12px);border-bottom:1px solid #ffffff18}.nav{max-width:1150px;margin:auto;padding:15px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}.logo{font-size:26px;font-weight:950;letter-spacing:-1px}.logo span{color:var(--cyan)}.tag{color:var(--muted);font-size:13px}.search{margin-left:auto;flex:1;max-width:400px}.search input{width:100%;background:#202945;border:1px solid #ffffff20;color:white;padding:12px 14px;border-radius:12px;outline:none}
main{max-width:1150px;margin:30px auto;padding:0 20px}.hero{padding:30px;border:1px solid #ffffff20;border-radius:22px;background:linear-gradient(120deg,#4c1d95aa,#0e749055);box-shadow:0 20px 60px #0003}.hero h1{font-size:clamp(28px,5vw,48px);margin:0 0 8px}.hero p{color:#d9dcf4;margin:0}.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.pill{background:#090e20a8;border:1px solid #ffffff22;padding:8px 12px;border-radius:99px;font-size:13px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}.filters button,.action{border:1px solid #ffffff20;background:#1b2440;color:white;padding:9px 14px;border-radius:11px;cursor:pointer}.filters button.active,.action.primary{background:var(--purple);border-color:var(--purple)}.sectionhead{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:25px 0 14px}.sectionhead h2{margin:0}.sectionhead small{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:15px}.game{background:linear-gradient(145deg,#1b2440,#131a30);border:1px solid #ffffff16;border-radius:17px;padding:17px;min-height:170px;display:flex;flex-direction:column;transition:.18s}.game:hover{transform:translateY(-3px);border-color:#8b5cf6aa}.emoji{font-size:36px}.game h3{margin:9px 0 4px}.game p{color:var(--muted);font-size:13px;margin:0 0 14px}.game button{margin-top:auto;background:#8b5cf6;color:white;border:0;border-radius:10px;padding:10px;font-weight:700;cursor:pointer}.game button:hover{filter:brightness(1.12)}
footer{text-align:center;color:var(--muted);padding:35px 15px;font-size:13px}
.overlay{position:fixed;inset:0;background:#050816eF;z-index:10;display:none;align-items:center;justify-content:center;padding:14px}.overlay.show{display:flex}.modal{width:min(760px,100%);max-height:94vh;overflow:auto;background:#151d34;border:1px solid #ffffff25;border-radius:20px;padding:18px;box-shadow:0 25px 90px #0009}.modalhead{display:flex;align-items:center;justify-content:space-between;gap:12px}.modalhead h2{margin:0}.close{background:#303b59;border:0;color:white;border-radius:10px;padding:9px 13px;cursor:pointer}.gamearea{min-height:330px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;padding:15px 0}.gamearea canvas{max-width:100%;background:#080e20;border:1px solid #ffffff22;border-radius:12px;touch-action:none}.gamearea button{background:#7650df;color:white;border:0;padding:10px 15px;border-radius:10px;cursor:pointer;font-weight:700}.gamearea .muted{color:var(--muted);font-size:13px;text-align:center}.board{display:grid;gap:8px}.board button{width:clamp(65px,18vw,100px);height:clamp(65px,18vw,100px);font-size:clamp(25px,7vw,40px);background:#293454}.memory{grid-template-columns:repeat(4, minmax(48px,75px))}.memory button{height:68px;font-size:27px}.tiles{grid-template-columns:repeat(4,minmax(48px,75px))}.tiles button{height:68px;font-size:22px;background:#35415f}.tiles button.filled{background:#7650df}.controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
@media(max-width:600px){.nav{gap:9px}.search{order:3;max-width:none;flex-basis:100%}.hero{padding:22px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.game{padding:13px;min-height:160px}.gamearea{min-height:300px}}
</style>
</head>
<body>
<header><div class="nav"><div class="logo">GAME<span>ZONE</span></div><div class="tag">Mini oyunların adresi 🎮</div><div class="search"><input id="search" placeholder="Oyun ara..." autocomplete="off"></div></div></header>
<main>
<section class="hero"><h1>Oyna, eğlen, rekor kır! 🎮</h1><p>Hepsi bu sitenin içinde açılır. Başlamak için bir oyun seç!</p><div class="stats"><span class="pill">✨ 8 ücretsiz mini oyun</span><span class="pill">📱 Telefon ve bilgisayar uyumlu</span><span class="pill">🚀 Başka siteye göndermez</span></div></section>
<div class="filters" id="filters"><button class="active" data-cat="Hepsi">Hepsi</button><button data-cat="Bulmaca">🧩 Bulmaca</button><button data-cat="Klasik">🕹️ Klasik</button><button data-cat="Hız">⚡ Hız</button></div>
<div class="sectionhead"><h2>Oyunlar</h2><small id="count">8 oyun</small></div><section class="grid" id="grid"></section>
</main><footer>GameZone • Oyunlar doğrudan bu sayfada çalışır.</footer>
<div class="overlay" id="overlay"><div class="modal"><div class="modalhead"><h2 id="gameTitle">Oyun</h2><button class="close" id="close">✕ Kapat</button></div><div class="gamearea" id="gamearea"></div></div></div>
<script>
const games=[
{id:'snake',name:'Yılan',emoji:'🐍',cat:'Klasik',desc:'Yemleri topla, kendi kuyruğuna çarpma.'},
{id:'xo',name:'X-O (Tic Tac Toe)',emoji:'❎',cat:'Bulmaca',desc:'Bilgisayara karşı üç taşı yan yana getir.'},
{id:'2048',name:'2048',emoji:'🔢',cat:'Bulmaca',desc:'Aynı sayıları birleştir ve 2048’e ulaş.'},
{id:'memory',name:'Hafıza Kartları',emoji:'🧠',cat:'Bulmaca',desc:'Aynı resimli kartların eşlerini bul.'},
{id:'pong',name:'Pong',emoji:'🏓',cat:'Klasik',desc:'Rakete yön ver ve topu kaçırma.'},
{id:'breakout',name:'Tuğla Kırma',emoji:'🧱',cat:'Klasik',desc:'Topla bütün tuğlaları kır.'},
{id:'reaction',name:'Refleks Testi',emoji:'⚡',cat:'Hız',desc:'Yeşil ışık yanınca olabildiğince hızlı bas.'},
{id:'clicker',name:'Tıklama Ustası',emoji:'👆',cat:'Hız',desc:'10 saniyede kaç kez tıklayabilirsin?'}
];
const grid=document.getElementById('grid'),search=document.getElementById('search');let category='Hepsi';
function render(){let q=search.value.toLocaleLowerCase('tr');let list=games.filter(g=>(category==='Hepsi'||g.cat===category)&&(g.name+' '+g.desc).toLocaleLowerCase('tr').includes(q));grid.innerHTML=list.map(g=>`<article class="game"><div class="emoji">${g.emoji}</div><h3>${g.name}</h3><p>${g.desc}</p><button data-game="${g.id}">Şimdi Oyna ▶</button></article>`).join('');document.getElementById('count').textContent=list.length+' oyun';}
render();search.addEventListener('input',render);document.getElementById('filters').addEventListener('click',e=>{if(e.target.dataset.cat){category=e.target.dataset.cat;document.querySelectorAll('.filters button').forEach(b=>b.classList.toggle('active',b===e.target));render();}});
const overlay=document.getElementById('overlay'),area=document.getElementById('gamearea');let cleanup=()=>{};function open(id){let g=games.find(x=>x.id===id);document.getElementById('gameTitle').textContent=g.name;overlay.classList.add('show');area.innerHTML='';cleanup();cleanup=()=>{};({snake, xo, '2048':game2048,memory,pong,breakout,reaction,clicker}[id])();}
function close(){cleanup();cleanup=()=>{};overlay.classList.remove('show');area.innerHTML='';}document.getElementById('close').onclick=close;overlay.addEventListener('click',e=>{if(e.target===overlay)close()});document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});grid.addEventListener('click',e=>{let b=e.target.closest('[data-game]');if(b)open(b.dataset.game)});
function btn(t,fn){let b=document.createElement('button');b.textContent=t;b.onclick=fn;area.append(b);return b}function note(t){let p=document.createElement('div');p.className='muted';p.textContent=t;area.append(p);return p}
function snake(){area.innerHTML='<canvas width="400" height="400"></canvas>';let c=area.querySelector('canvas'),x=c.getContext('2d'),s=[{x:10,y:10}],d={x:1,y:0},food={x:5,y:5},score=0,alive=true;let info=note('Ok tuşları veya WASD ile hareket et.');function tick(){if(!alive)return;let h={x:s[0].x+d.x,y:s[0].y+d.y};if(h.x<0||h.x>=20||h.y<0||h.y>=20||s.some(p=>p.x===h.x&&p.y===h.y)){alive=false;info.textContent='Oyun bitti! Skor: '+score;return;}s.unshift(h);if(h.x===food.x&&h.y===food.y){score++;food={x:Math.floor(Math.random()*20),y:Math.floor(Math.random()*20)};info.textContent='Skor: '+score;}else s.pop();x.fillStyle='#080e20';x.fillRect(0,0,400,400);x.fillStyle='#22d3ee';s.forEach(p=>x.fillRect(p.x*20+1,p.y*20+1,18,18));x.fillStyle='#f97316';x.fillRect(food.x*20+1,food.y*20+1,18,18);}let iv=setInterval(tick,115);function key(e){let m={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]}[e.key];if(m&&!(m[0]===-d.x&&m[1]===-d.y)){d={x:m[0],y:m[1]};e.preventDefault();}}document.addEventListener('keydown',key);cleanup=()=>{clearInterval(iv);document.removeEventListener('keydown',key)};btn('Yeniden Başlat',()=>{cleanup();snake()});}
function xo(){let b=Array(9).fill(''),turn='X',done=false;let board=document.createElement('div');board.className='board';board.style.gridTemplateColumns='repeat(3,1fr)';area.append(board);let status=note('Sen X’sin. Bilgisayar O.');function win(a){return [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]].some(l=>l.every(i=>a[i]===a[l[0]]&&a[i]));}function draw(){board.innerHTML='';b.forEach((v,i)=>{let z=document.createElement('button');z.textContent=v;z.onclick=()=>move(i);board.append(z)});}function move(i){if(done||b[i])return;b[i]='X';if(win(b)){done=true;status.textContent='Kazandın! 🎉';draw();return;}if(b.every(Boolean)){done=true;status.textContent='Berabere!';draw();return;}let empt=b.map((v,i)=>v?null:i).filter(v=>v!==null);let choice=empt.find(i=>{let t=b.slice();t[i]='O';return win(t)});if(choice===undefined)choice=empt[Math.floor(Math.random()*empt.length)];b[choice]='O';if(win(b)){done=true;status.textContent='Bilgisayar kazandı.'}else if(b.every(Boolean)){done=true;status.textContent='Berabere!'}draw();}draw();btn('Tekrar Oyna',()=>xo());}
function game2048(){let a=Array(16).fill(0),score=0;let board=document.createElement('div');board.className='board tiles';area.append(board);let status=note('Ok tuşları veya WASD ile kaydır.');function add(){let e=a.map((v,i)=>v?null:i).filter(v=>v!==null);if(e.length)a[e[Math.floor(Math.random()*e.length)]]=Math.random()<.9?2:4;}function draw(){board.innerHTML='';a.forEach(v=>{let z=document.createElement('button');z.textContent=v||'';z.classList.toggle('filled',!!v);board.append(z)});status.textContent='Skor: '+score;}function move(dir){let changed=false;for(let line=0;line<4;line++){let ids=Array.from({length:4},(_,k)=>dir==='left'?line*4+k:dir==='right'?line*4+3-k:dir==='up'?k*4+line:(3-k)*4+line);let vals=ids.map(i=>a[i]).filter(Boolean);for(let k=0;k<vals.length-1;k++)if(vals[k]===vals[k+1]){vals[k]*=2;score+=vals[k];vals.splice(k+1,1);}while(vals.length<4)vals.push(0);ids.forEach((id,k)=>{if(a[id]!==vals[k])changed=true;a[id]=vals[k]});}if(changed)add();draw();}add();add();draw();function key(e){let d={ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right',ArrowUp:'up',w:'up',ArrowDown:'down',s:'down'}[e.key];if(d){e.preventDefault();move(d)}}document.addEventListener('keydown',key);cleanup=()=>document.removeEventListener('keydown',key);btn('Yeniden Başlat',()=>{cleanup();game2048()});}
function memory(){let icons=['🍉','🚀','🐱','⚽','🍕','🌟','🐸','🎈'],cards=[...icons,...icons].sort(()=>Math.random()-.5),first=null,lock=false,matches=0,moves=0;let board=document.createElement('div');board.className='board memory';area.append(board);let status=note('Eşleşen kartları bul.');function draw(){board.innerHTML='';cards.forEach((v,i)=>{let b=document.createElement('button');b.textContent=v.open||v.done?v:'❔';b.disabled=!!v.done;b.onclick=()=>flip(i);board.append(b)});status.textContent='Hamle: '+moves+' • Eşleşme: '+matches+'/8';}function flip(i){if(lock||cards[i].done||cards[i].open)return;cards[i].open=true;if(first===null){first=i;}else{moves++;let prev=first;first=null;if(cards[prev]===cards[i]){}if(cards[prev].v===cards[i].v){cards[prev].done=cards[i].done=true;matches++;}else{lock=true;draw();setTimeout(()=>{cards[prev].open=cards[i].open=false;lock=false;draw()},650);return;}}draw();if(matches===8)status.textContent='Harika! Bütün eşleri buldun 🎉';}cards=cards.map(v=>({v}));draw();btn('Karıştır ve Yeniden Başla',()=>memory());}
function pong(){area.innerHTML='<canvas width="520" height="330"></canvas>';let c=area.querySelector('canvas'),x=c.getContext('2d'),py=135,by=145,bx=250,vx=4,vy=3,score=0,alive=true;let status=note('Fareyi veya parmağını oyun alanında yukarı-aşağı hareket ettir.');function frame(){if(!alive)return;bx+=vx;by+=vy;if(by<8||by>322)vy*=-1;if(bx>495&&by>py-35&&by<py+55){vx*=-1;score++;}if(bx<25){vx=Math.abs(vx); }if(bx>515){alive=false;status.textContent='Oyun bitti • Skor: '+score;}if(bx<10){alive=false;status.textContent='Oyun bitti • Skor: '+score;}py+=((target-py)-25)*.15;x.fillStyle='#080e20';x.fillRect(0,0,520,330);x.fillStyle='#22d3ee';x.fillRect(495,py,10,65);x.fillStyle='#f8fafc';x.beginPath();x.arc(bx,by,8,0,7);x.fill();x.fillText('Skor: '+score,15,22);requestAnimationFrame(frame);}let target=135;c.addEventListener('pointermove',e=>{let r=c.getBoundingClientRect();target=(e.clientY-r.top)*330/r.height;});requestAnimationFrame(frame);btn('Yeniden Başlat',()=>pong());}
function breakout(){area.innerHTML='<canvas width="520" height="360"></canvas>';let c=area.querySelector('canvas'),x=c.getContext('2d'),px=220,bx=260,by=300,vx=3,vy=-3,blocks=[],score=0,alive=true;for(let r=0;r<4;r++)for(let k=0;k<8;k++)blocks.push({x:12+k*63,y:25+r*27,on:true});let status=note('Fare/parmak ile raketi hareket ettir.');c.addEventListener('pointermove',e=>{let r=c.getBoundingClientRect();px=(e.clientX-r.left)*520/r.width-45;});function frame(){if(!alive)return;bx+=vx;by+=vy;if(bx<8||bx>512)vx*=-1;if(by<8)vy*=-1;if(by>320&&bx>px&&bx<px+90)vy=-Math.abs(vy);if(by>360){alive=false;status.textContent='Oyun bitti • Skor: '+score;}blocks.forEach(b=>{if(b.on&&bx>b.x&&bx<b.x+55&&by>b.y&&by<b.y+17){b.on=false;vy*=-1;score++;}});x.fillStyle='#080e20';x.fillRect(0,0,520,360);blocks.filter(b=>b.on).forEach(b=>{x.fillStyle='#8b5cf6';x.fillRect(b.x,b.y,55,17)});x.fillStyle='#22d3ee';x.fillRect(px,330,90,10);x.fillStyle='white';x.beginPath();x.arc(bx,by,7,0,7);x.fill();x.fillText('Skor: '+score,12,350);if(blocks.every(b=>!b.on)){alive=false;status.textContent='Kazandın! 🎉';}requestAnimationFrame(frame);}requestAnimationFrame(frame);btn('Yeniden Başlat',()=>breakout());}
function reaction(){let state='wait',start=0,timer=null;let box=document.createElement('div');box.style.cssText='font-size:22px;text-align:center;padding:35px 15px;border-radius:18px;background:#26314f;width:min(420px,100%);';box.textContent='Hazır mısın? Başlat’a bas.';area.append(box);let b=btn('Başlat',begin);let status=note('Yeşil olduğunda hemen tıkla.');function begin(){clearTimeout(timer);state='wait';box.style.background='#8b5cf6';box.textContent='Bekle...';b.textContent='Bekliyorum';timer=setTimeout(()=>{state='go';start=performance.now();box.style.background='#15803d';box.textContent='ŞİMDİ TIKLA!';b.textContent='TIKLA!'},1200+Math.random()*2800);}b.onclick=()=>{if(state==='go'){status.textContent='Tepki süren: '+Math.round(performance.now()-start)+' ms';state='done';box.textContent='Güzel refleks!';b.textContent='Tekrar Dene';}else if(state==='wait'){clearTimeout(timer);status.textContent='Erken bastın! Yeşil olmasını bekle.';state='done';b.textContent='Tekrar Dene';box.textContent='Biraz erken oldu!';}else begin();};}
function clicker(){let n=0,left=10,running=false;let big=document.createElement('div');big.style.cssText='font-size:26px;font-weight:800';area.append(big);let b=btn('TIKLA! 👆',()=>{if(!running){running=true;left=10;n=0;let end=Date.now()+10000;let iv=setInterval(()=>{left=Math.max(0,Math.ceil((end-Date.now())/1000));big.textContent='Tıklama: '+n+' • '+left+' sn';if(left<=0){clearInterval(iv);running=false;b.textContent='Tekrar Oyna';}},100);cleanup=()=>clearInterval(iv);b.textContent='TIKLA! 👆';}if(running){n++;big.textContent='Tıklama: '+n+' • '+left+' sn';} });big.textContent='10 saniyede en yüksek skoru yap!';}
</script>
</body></html>
